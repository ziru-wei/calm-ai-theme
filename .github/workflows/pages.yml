name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only the public files)
        run: |
          mkdir _site
          cp index.html state.json _site/
          mkdir _site/related-works
          cd related-works
          cp index.html app.js app.css settings.json axes.json catalog.defaults.json ../_site/related-works/
          for f in catalog.json; do [ -f "$f" ] && cp "$f" ../_site/related-works/ || true; done
          for d in notes images; do [ -d "$d" ] && cp -r "$d" ../_site/related-works/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
