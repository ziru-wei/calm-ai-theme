<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v3: two lanes. Fields of the information item route to a semantic lane (LLM) and a rule lane, which merge into the cue. -->
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1080" height="480" fill="#FFFFFF"/>

  <!-- lanes -->
  <rect x="270" y="30" width="540" height="170" rx="14" fill="#F4F8FF"/>
  <text x="290" y="56" font-size="12" font-weight="700" fill="#2F6FEB" letter-spacing="1">SEMANTIC CHOICES · LLM, FINITE SETS</text>
  <rect x="270" y="222" width="540" height="150" rx="14" fill="#F2FAF8"/>
  <text x="290" y="248" font-size="12" font-weight="700" fill="#0F8A78" letter-spacing="1">RULES</text>

  <!-- information item -->
  <rect x="20" y="110" width="210" height="220" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="38" y="140" font-size="15" font-weight="700" fill="#1F2328">Information item</text>
  <g font-family="Menlo, monospace" font-size="12.5" fill="#1F2328">
    <circle cx="44" cy="170" r="5" fill="#2F6FEB"/><text x="58" y="174">referent</text>
    <circle cx="44" cy="200" r="5" fill="#2F6FEB"/><text x="58" y="204">quality</text>
    <circle cx="44" cy="236" r="5" fill="#0F8A78"/><text x="58" y="240">value</text>
    <circle cx="44" cy="266" r="5" fill="#0F8A78"/><text x="58" y="270">urgency</text>
    <circle cx="44" cy="302" r="5" fill="none" stroke="#9CA3AF" stroke-dasharray="2 2"/><text x="58" y="306" fill="#9CA3AF">text</text>
  </g>

  <!-- semantic lane boxes -->
  <rect x="300" y="76" width="210" height="80" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="318" y="104" font-size="15" font-weight="700" fill="#1F2328">1  Carrier resolution</text>
  <text x="318" y="128" font-size="12.5" fill="#4B5563">referent part → proxy</text>
  <text x="318" y="146" font-size="12.5" fill="#4B5563">→ direction</text>
  <text x="405" y="182" font-size="11.5" fill="#6B7280" text-anchor="middle">+ scene description</text>

  <rect x="570" y="76" width="210" height="80" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="588" y="104" font-size="15" font-weight="700" fill="#1F2328">2  Phenomenon</text>
  <text x="588" y="128" font-size="12.5" fill="#4B5563">natural sign on the carrier;</text>
  <text x="588" y="146" font-size="12.5" fill="#4B5563">fixes the cue type</text>
  <text x="675" y="182" font-size="11.5" fill="#6B7280" text-anchor="middle">+ phenomenon library</text>

  <!-- rule lane boxes -->
  <rect x="300" y="264" width="210" height="80" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="318" y="292" font-size="15" font-weight="700" fill="#1F2328">3  Dynamics</text>
  <text x="318" y="316" font-size="12.5" fill="#4B5563">distance from normal</text>
  <text x="318" y="334" font-size="12.5" fill="#4B5563">→ intensity, rate</text>

  <rect x="570" y="264" width="210" height="80" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="588" y="292" font-size="15" font-weight="700" fill="#1F2328">4  Trigger</text>
  <text x="588" y="316" font-size="12.5" fill="#4B5563">urgency</text>
  <text x="588" y="334" font-size="12.5" fill="#4B5563">→ always / on approach</text>

  <!-- output -->
  <rect x="860" y="150" width="200" height="140" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="960" y="196" font-size="15" font-weight="700" fill="#1F2328" text-anchor="middle">Indexical cue</text>
  <text x="960" y="222" font-size="12.5" fill="#4B5563" text-anchor="middle">on the carrier,</text>
  <text x="960" y="240" font-size="12.5" fill="#4B5563" text-anchor="middle">in AR</text>
  <text x="960" y="266" font-size="12" fill="#C26A00" text-anchor="middle">Vision Pro</text>

  <!-- digital layer (future) -->
  <rect x="300" y="400" width="480" height="48" rx="10" fill="#FFFFFF" stroke="#C9CDD3" stroke-dasharray="5 4"/>
  <text x="540" y="429" font-size="13" fill="#9CA3AF" text-anchor="middle">Digital layer and lifecycle (future work)</text>

  <!-- arrows -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a3)">
    <path d="M232 185 C 262 185, 270 116, 296 116"/>
    <path d="M232 252 C 262 252, 270 304, 296 304"/>
    <path d="M512 116 H566"/>
    <path d="M512 304 H566"/>
    <path d="M782 116 C 830 116, 820 200, 856 200"/>
    <path d="M782 304 C 830 304, 820 240, 856 240"/>
  </g>
  <path d="M232 302 C 262 302, 262 424, 296 424" stroke="#C9CDD3" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#a3)"/>
  <g font-size="11.5" fill="#6B7280">
    <text x="788" y="104">carrier, phenomenon</text>
    <text x="788" y="330">intensity, rate, trigger</text>
  </g>
</svg>
