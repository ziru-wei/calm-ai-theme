<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 830" width="820" height="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v2: vertical pipeline on the left, the tea example walked through on the right. -->
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="820" height="830" fill="#FFFFFF"/>

  <g font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1">
    <text x="40" y="22">PIPELINE</text>
    <text x="430" y="22">EXAMPLE: TEA COOLING</text>
  </g>

  <!-- left column -->
  <g fill="#1F2328">
    <rect x="40" y="36" width="300" height="96" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
    <text x="60" y="66" font-size="15" font-weight="700">Information item</text>
    <text x="60" y="90" font-size="12.5" fill="#4B5563">from upstream sensors, devices, AI</text>
    <text x="60" y="110" font-size="12.5" fill="#4B5563">referent · quality · value · urgency</text>

    <rect x="40" y="168" width="300" height="96" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
    <text x="60" y="198" font-size="15" font-weight="700">1  Carrier resolution</text>
    <text x="60" y="222" font-size="12.5" fill="#2F6FEB">LLM + scene description</text>
    <text x="60" y="242" font-size="12.5" fill="#4B5563">referent part → proxy → direction</text>

    <rect x="40" y="300" width="300" height="96" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
    <text x="60" y="330" font-size="15" font-weight="700">2  Phenomenon selection</text>
    <text x="60" y="354" font-size="12.5" fill="#2F6FEB">LLM + phenomenon library</text>
    <text x="60" y="374" font-size="12.5" fill="#4B5563">the phenomenon fixes the cue type</text>

    <rect x="40" y="432" width="300" height="96" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
    <text x="60" y="462" font-size="15" font-weight="700">3  Dynamics</text>
    <text x="60" y="486" font-size="12.5" fill="#0F8A78">rule from value type</text>
    <text x="60" y="506" font-size="12.5" fill="#4B5563">distance from normal → intensity</text>

    <rect x="40" y="564" width="300" height="96" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
    <text x="60" y="594" font-size="15" font-weight="700">4  Trigger</text>
    <text x="60" y="618" font-size="12.5" fill="#0F8A78">rule from urgency</text>
    <text x="60" y="638" font-size="12.5" fill="#4B5563">always, or on approach</text>

    <rect x="40" y="696" width="300" height="96" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
    <text x="60" y="726" font-size="15" font-weight="700">Indexical cue</text>
    <text x="60" y="750" font-size="12.5" fill="#C26A00">rendered on Vision Pro</text>
    <text x="60" y="770" font-size="12.5" fill="#4B5563">disappears when the state is normal</text>
  </g>

  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a2)">
    <path d="M190 134 V164"/>
    <path d="M190 266 V296"/>
    <path d="M190 398 V428"/>
    <path d="M190 530 V560"/>
    <path d="M190 662 V692"/>
  </g>

  <!-- right column: example -->
  <g stroke="#C9CDD3" stroke-width="1.4" stroke-dasharray="3 4">
    <path d="M342 84 H426"/>
    <path d="M342 216 H426"/>
    <path d="M342 348 H426"/>
    <path d="M342 480 H426"/>
    <path d="M342 612 H426"/>
    <path d="M342 744 H426"/>
  </g>
  <g font-size="12.5" fill="#1F2328">
    <rect x="430" y="36" width="350" height="96" rx="10" fill="#FFFFFF" stroke="#E2E5E9"/>
    <g font-family="Menlo, monospace" font-size="12">
      <text x="448" y="62">referent: tea (cup-01)</text>
      <text x="448" y="82">quality:  thermal.hot</text>
      <text x="448" y="102">value:    level 72 °C, ok &lt; 60, max 95</text>
      <text x="448" y="122">urgency:  0.2</text>
    </g>

    <rect x="430" y="168" width="350" height="96" rx="10" fill="#FFFFFF" stroke="#E2E5E9"/>
    <text x="448" y="200">referent is in the scene</text>
    <text x="448" y="224" font-weight="700">→ carrier: rim of the cup</text>

    <rect x="430" y="300" width="350" height="96" rx="10" fill="#FFFFFF" stroke="#E2E5E9"/>
    <text x="448" y="332">"What would hot tea look like?"</text>
    <text x="448" y="356" font-weight="700">→ steam  ·  Emit  ·  visual</text>

    <rect x="430" y="432" width="350" height="96" rx="10" fill="#FFFFFF" stroke="#E2E5E9"/>
    <text x="448" y="464" font-family="Menlo, monospace" font-size="12">(72 − 60) / (95 − 60) = 0.34</text>
    <text x="448" y="488" font-weight="700">→ light steam, thinning as it cools</text>
    <text x="448" y="510" fill="#6B7280">0 at 60 °C</text>

    <rect x="430" y="564" width="350" height="96" rx="10" fill="#FFFFFF" stroke="#E2E5E9"/>
    <text x="448" y="596">urgency 0.2 is low</text>
    <text x="448" y="620" font-weight="700">→ shown when the person comes near</text>

    <rect x="430" y="696" width="350" height="96" rx="10" fill="#FFF9F1" stroke="#F0C48A"/>
    <text x="448" y="728" font-weight="700">Steam above the cup thins as the</text>
    <text x="448" y="748" font-weight="700">tea cools and stops when it is</text>
    <text x="448" y="768" font-weight="700">drinkable.</text>
  </g>
</svg>
