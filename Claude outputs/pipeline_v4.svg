<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v4: revision of v3. Lanes split by timescale: BIND once per item (LLM, joint choice), DRIVE on every update (rules, in parallel). -->
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1080" height="480" fill="#FFFFFF"/>

  <!-- lanes -->
  <rect x="260" y="30" width="520" height="180" rx="14" fill="#F4F8FF"/>
  <text x="280" y="56" font-size="12" font-weight="700" fill="#2F6FEB" letter-spacing="1">BIND · ONCE PER ITEM · LLM</text>
  <rect x="260" y="230" width="520" height="170" rx="14" fill="#F2FAF8"/>
  <text x="280" y="256" font-size="12" font-weight="700" fill="#0F8A78" letter-spacing="1">DRIVE · EVERY UPDATE · RULES</text>

  <!-- information item -->
  <rect x="20" y="40" width="200" height="226" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="38" y="70" font-size="15" font-weight="700" fill="#1F2328">Information item</text>
  <g font-family="Menlo, monospace" font-size="12.5" fill="#1F2328">
    <circle cx="44" cy="98" r="5" fill="#2F6FEB"/><text x="58" y="102">referent</text>
    <circle cx="44" cy="126" r="5" fill="#2F6FEB"/><text x="58" y="130">quality</text>
    <circle cx="44" cy="154" r="5" fill="#2F6FEB"/><text x="58" y="158">value.type</text>
    <circle cx="44" cy="186" r="5" fill="#0F8A78"/><text x="58" y="190">value</text>
    <circle cx="44" cy="214" r="5" fill="#0F8A78"/><text x="58" y="218">urgency</text>
    <circle cx="44" cy="244" r="5" fill="none" stroke="#9CA3AF" stroke-dasharray="2 2"/><text x="58" y="248" fill="#9CA3AF">text</text>
  </g>
  <text x="120" y="288" font-size="11.5" fill="#6B7280" text-anchor="middle">value updates stream in</text>

  <!-- runtime context -->
  <rect x="20" y="312" width="200" height="72" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="38" y="340" font-size="15" font-weight="700" fill="#1F2328">Runtime context</text>
  <text x="38" y="364" font-size="12.5" fill="#4B5563">user position and view</text>

  <!-- bind -->
  <rect x="290" y="72" width="460" height="96" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="310" y="100" font-size="15" font-weight="700" fill="#1F2328">Choose carrier + phenomenon, jointly</text>
  <text x="310" y="124" font-size="12.5" fill="#4B5563">carrier: referent part → functional proxy → direction</text>
  <text x="310" y="144" font-size="12.5" fill="#4B5563">phenomenon: a natural sign that fits the carrier and the value type</text>
  <text x="310" y="194" font-size="11.5" fill="#6B7280">+ scene description</text>
  <text x="460" y="194" font-size="11.5" fill="#6B7280">+ phenomenon library</text>

  <!-- drive -->
  <rect x="290" y="276" width="215" height="90" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="308" y="304" font-size="15" font-weight="700" fill="#1F2328">Dynamics</text>
  <text x="308" y="328" font-size="12.5" fill="#4B5563">value vs. normal</text>
  <text x="308" y="346" font-size="12.5" fill="#4B5563">→ intensity, rate</text>

  <rect x="535" y="276" width="215" height="90" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="553" y="304" font-size="15" font-weight="700" fill="#1F2328">Trigger</text>
  <text x="553" y="328" font-size="12.5" fill="#4B5563">urgency + proximity</text>
  <text x="553" y="346" font-size="12.5" fill="#4B5563">→ show / hide</text>

  <!-- output -->
  <rect x="840" y="140" width="220" height="180" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="950" y="186" font-size="15" font-weight="700" fill="#1F2328" text-anchor="middle">Indexical cue</text>
  <text x="950" y="212" font-size="12.5" fill="#4B5563" text-anchor="middle">on the carrier, in AR</text>
  <text x="950" y="236" font-size="12" fill="#C26A00" text-anchor="middle">Vision Pro</text>
  <text x="950" y="276" font-size="12" fill="#4B5563" text-anchor="middle">fades out when the</text>
  <text x="950" y="294" font-size="12" fill="#4B5563" text-anchor="middle">value returns to normal</text>

  <!-- digital layer (future) -->
  <rect x="260" y="420" width="520" height="40" rx="10" fill="#FFFFFF" stroke="#C9CDD3" stroke-dasharray="5 4"/>
  <text x="520" y="445" font-size="13" fill="#9CA3AF" text-anchor="middle">Digital layer and lifecycle (future work)</text>

  <!-- arrows -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a4)">
    <path d="M222 126 C 254 126, 258 120, 286 120"/>
    <path d="M222 200 C 254 200, 258 321, 286 321"/>
    <path d="M222 348 C 420 410, 600 410, 642 370"/>
    <path d="M752 120 C 800 120, 800 200, 836 200"/>
    <path d="M782 321 C 810 321, 810 270, 836 270"/>
  </g>
  <path d="M222 244 C 240 244, 240 440, 256 440" stroke="#C9CDD3" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#a4)"/>
  <g font-size="11.5" fill="#6B7280">
    <text x="760" y="104">cue instance</text>
    <text x="788" y="346">intensity, rate,</text>
    <text x="788" y="362">visible</text>
  </g>
</svg>
