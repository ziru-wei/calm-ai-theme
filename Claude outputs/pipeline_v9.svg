<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 750" width="1520" height="750" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v9: three items (pan, bus, meeting) at one moment (8:36). Order: step 1 per item (blue) → lifecycle across all cues (purple) → step 2 per item (green) → all cues in AR. -->
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1520" height="750" fill="#FFFFFF"/>

  <!-- column headers -->
  <g font-size="11.5" font-weight="700" letter-spacing="1">
    <text x="20" y="40" fill="#6B7280">INFORMATION ITEMS</text>
    <text x="330" y="40" fill="#2F6FEB">REPRESENTATION · STEP 1 · PER ITEM</text>
    <text x="650" y="40" fill="#7C5CD6">LIFECYCLE MANAGEMENT · ALL CUES</text>
    <text x="1000" y="40" fill="#0F8A78">REPRESENTATION · STEP 2 · PER ITEM</text>
    <text x="1300" y="40" fill="#C26A00">OUTPUT</text>
  </g>
  <g font-size="11" fill="#9CA3AF">
    <text x="330" y="56">once per item, fixed · LLM</text>
    <text x="650" y="56">whenever anything changes · rules</text>
    <text x="1000" y="56">when the value or allowance changes · rules</text>
  </g>

  <!-- ===== row 1: pan ===== -->
  <rect x="20" y="70" width="270" height="182" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <g font-family="Menlo, monospace" font-size="11" fill="#1F2328" xml:space="preserve">
    <text x="34" y="92">{</text>
    <text x="34" y="107">&#160;&#160;"id": "pan",</text>
    <text x="34" y="122">&#160;&#160;"referent": "pan handle",</text>
    <text x="34" y="137">&#160;&#160;"anchor_id": "obj-pan",</text>
    <text x="34" y="152">&#160;&#160;"quality": "thermal.hot",</text>
    <text x="34" y="167">&#160;&#160;"value": { "type": "level",</text>
    <text x="34" y="182">&#160;&#160;&#160;&#160;"value": 70, "ok_below": 45,</text>
    <text x="34" y="197">&#160;&#160;&#160;&#160;"max": 120 },</text>
    <text x="34" y="212">&#160;&#160;"urgency": 0.6,</text>
    <text x="34" y="227">&#160;&#160;"text": "Handle 70 °C"</text>
    <text x="34" y="242">}</text>
  </g>

  <rect x="330" y="70" width="280" height="182" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="346" y="96" font-size="14" font-weight="700" fill="#1F2328">Pan</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="346" y="124"><tspan font-weight="700">where</tspan>  the pan handle</text>
    <text x="346" y="154"><tspan font-weight="700">visual</tspan>  warm red tint</text>
    <text x="346" y="178"><tspan font-weight="700">sound</tspan>  <tspan fill="#9CA3AF">none</tspan></text>
    <text x="346" y="202"><tspan font-weight="700">text</tspan>  "Handle 70 °C"</text>
  </g>

  <rect x="1000" y="70" width="270" height="182" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="1016" y="96" font-size="14" font-weight="700" fill="#1F2328">Pan</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="1016" y="124">strength (70 − 45) / (120 − 45) = 0.33</text>
    <text x="1016" y="154"><tspan font-weight="700">visual</tspan>  0.33 × 1.0 = 0.33</text>
    <text x="1016" y="178"><tspan font-weight="700">sound</tspan>  <tspan fill="#9CA3AF">none</tspan></text>
    <text x="1016" y="202"><tspan font-weight="700">text</tspan>  off</text>
  </g>

  <!-- ===== row 2: bus ===== -->
  <rect x="20" y="272" width="270" height="182" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <g font-family="Menlo, monospace" font-size="11" fill="#1F2328" xml:space="preserve">
    <text x="34" y="294">{</text>
    <text x="34" y="309">&#160;&#160;"id": "bus",</text>
    <text x="34" y="324">&#160;&#160;"referent": "Bus 204",</text>
    <text x="34" y="339">&#160;&#160;"anchor_id": null,</text>
    <text x="34" y="354">&#160;&#160;"quality": "arrival.approaching",</text>
    <text x="34" y="369">&#160;&#160;"value": { "type": "countdown",</text>
    <text x="34" y="384">&#160;&#160;&#160;&#160;"eta_s": 240 },</text>
    <text x="34" y="399">&#160;&#160;"urgency": 0.8,</text>
    <text x="34" y="414">&#160;&#160;"text": "Bus 204 · 4 min"</text>
    <text x="34" y="429">}</text>
  </g>

  <rect x="330" y="272" width="280" height="182" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="346" y="298" font-size="14" font-weight="700" fill="#1F2328">Bus</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="346" y="326"><tspan font-weight="700">where</tspan>  the window facing the street</text>
    <text x="346" y="356"><tspan font-weight="700">visual</tspan>  headlights sweep the glass</text>
    <text x="346" y="380"><tspan font-weight="700">sound</tspan>  engine, from the street</text>
    <text x="346" y="404"><tspan font-weight="700">text</tspan>  "Bus 204 · 4 min"</text>
  </g>

  <rect x="1000" y="272" width="270" height="182" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="1016" y="298" font-size="14" font-weight="700" fill="#1F2328">Bus</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="1016" y="326">strength 1 − 240 / 600 = 0.6</text>
    <text x="1016" y="356"><tspan font-weight="700">visual</tspan>  0.6 × 0.8 = 0.48</text>
    <text x="1016" y="380"><tspan font-weight="700">sound</tspan>  0.6 × 1.0 = 0.6</text>
    <text x="1016" y="404"><tspan font-weight="700">text</tspan>  on</text>
  </g>

  <!-- ===== row 3: meeting ===== -->
  <rect x="20" y="474" width="270" height="182" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <g font-family="Menlo, monospace" font-size="11" fill="#1F2328" xml:space="preserve">
    <text x="34" y="496">{</text>
    <text x="34" y="511">&#160;&#160;"id": "meeting",</text>
    <text x="34" y="526">&#160;&#160;"referent": "Team sync",</text>
    <text x="34" y="541">&#160;&#160;"anchor_id": null,</text>
    <text x="34" y="556">&#160;&#160;"quality": "time.approaching",</text>
    <text x="34" y="571">&#160;&#160;"value": { "type": "countdown",</text>
    <text x="34" y="586">&#160;&#160;&#160;&#160;"eta_s": 1440 },</text>
    <text x="34" y="601">&#160;&#160;"urgency": 0.5,</text>
    <text x="34" y="616">&#160;&#160;"text": "Team sync · 9:00"</text>
    <text x="34" y="631">}</text>
  </g>

  <rect x="330" y="474" width="280" height="182" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="346" y="500" font-size="14" font-weight="700" fill="#1F2328">Meeting</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="346" y="528"><tspan font-weight="700">where</tspan>  the wall clock</text>
    <text x="346" y="558"><tspan font-weight="700">visual</tspan>  faint glow of the clock face</text>
    <text x="346" y="582"><tspan font-weight="700">sound</tspan>  ticking</text>
    <text x="346" y="606"><tspan font-weight="700">text</tspan>  "Team sync · 9:00"</text>
  </g>

  <rect x="1000" y="474" width="270" height="182" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="1016" y="500" font-size="14" font-weight="700" fill="#1F2328">Meeting</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="1016" y="528">strength 1 − 1440 / 1800 = 0.2</text>
    <text x="1016" y="558"><tspan font-weight="700">visual</tspan>  0.2 × 0.5 = 0.1</text>
    <text x="1016" y="582"><tspan font-weight="700">sound</tspan>  0.2 × 0 = 0, off</text>
    <text x="1016" y="606"><tspan font-weight="700">text</tspan>  off</text>
  </g>

  <!-- ===== lifecycle management (spans all rows) ===== -->
  <rect x="650" y="70" width="310" height="586" rx="12" fill="#F5F2FE" stroke="#7C5CD6"/>
  <text x="668" y="98" font-size="15" font-weight="700" fill="#1F2328">Orchestrating all cues · 8:36</text>
  <text x="668" y="118" font-size="12" fill="#7C5CD6">in: each cue's where + ways, urgency,</text>
  <text x="668" y="134" font-size="12" fill="#7C5CD6">and human context</text>

  <g font-size="12.5" fill="#1F2328">
    <text x="668" y="166" font-weight="700">a  Rank</text>
    <text x="684" y="184" fill="#4B5563">urgency, raised if near or looked at</text>
    <text x="684" y="202" fill="#4B5563">bus 0.9 · pan 0.7 · meeting 0.5</text>

    <text x="668" y="232" font-weight="700">b  Sound: one at a time</text>
    <text x="684" y="250" fill="#4B5563">to the top-ranked cue that has one: bus</text>
    <text x="684" y="268" fill="#4B5563">meeting's ticking is turned off</text>

    <text x="668" y="298" font-weight="700">c  Visual: all three fit in view</text>
    <text x="684" y="316" fill="#4B5563">full for the cue near the hand: pan</text>
    <text x="684" y="334" fill="#4B5563">others weaker by rank, not removed</text>

    <text x="668" y="364" font-weight="700">d  Text: where the person looks</text>
    <text x="684" y="382" fill="#4B5563">looking at the window: bus</text>

    <text x="668" y="412" font-weight="700">e  Absent: low urgency and far</text>
    <text x="684" y="430" fill="#4B5563">none at this moment</text>
  </g>

  <!-- allocation table -->
  <rect x="668" y="452" width="274" height="186" rx="8" fill="#FFFFFF" stroke="#D8CDF7"/>
  <g font-size="12" fill="#6B7280" font-weight="700">
    <text x="684" y="476">allowed</text>
    <text x="790" y="476" text-anchor="middle">visual</text>
    <text x="852" y="476" text-anchor="middle">sound</text>
    <text x="910" y="476" text-anchor="middle">text</text>
  </g>
  <line x1="680" y1="486" x2="930" y2="486" stroke="#E5E0F7"/>
  <g font-size="12.5" fill="#1F2328">
    <text x="684" y="512" font-weight="700">pan</text>
    <text x="790" y="512" text-anchor="middle">1.0</text>
    <text x="852" y="512" text-anchor="middle" fill="#9CA3AF">none</text>
    <text x="910" y="512" text-anchor="middle">0</text>
    <text x="684" y="548" font-weight="700">bus</text>
    <text x="790" y="548" text-anchor="middle">0.8</text>
    <text x="852" y="548" text-anchor="middle">1.0</text>
    <text x="910" y="548" text-anchor="middle">1</text>
    <text x="684" y="584" font-weight="700">meeting</text>
    <text x="790" y="584" text-anchor="middle">0.5</text>
    <text x="852" y="584" text-anchor="middle">0</text>
    <text x="910" y="584" text-anchor="middle">0</text>
  </g>
  <text x="684" y="620" font-size="11.5" fill="#7C5CD6">0 = off; all 0 = absent for now</text>

  <!-- human context -->
  <rect x="690" y="686" width="230" height="44" rx="8" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="805" y="706" font-size="12" fill="#1F2328" text-anchor="middle">Human context</text>
  <text x="805" y="722" font-size="11.5" fill="#4B5563" text-anchor="middle">near the stove, looking at the window</text>

  <!-- output -->
  <rect x="1310" y="190" width="190" height="346" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="1326" y="218" font-size="15" font-weight="700" fill="#1F2328">All cues in AR</text>
  <text x="1326" y="236" font-size="12" fill="#C26A00">8:36</text>
  <g font-size="12.5" fill="#1F2328">
    <text x="1326" y="272" font-weight="700">Pan handle</text>
    <text x="1326" y="290" fill="#4B5563">faint warm red</text>
    <text x="1326" y="334" font-weight="700">Window</text>
    <text x="1326" y="352" fill="#4B5563">headlights sweep,</text>
    <text x="1326" y="370" fill="#4B5563">engine from the street,</text>
    <text x="1326" y="388" fill="#4B5563">"Bus 204 · 4 min"</text>
    <text x="1326" y="432" font-weight="700">Wall clock</text>
    <text x="1326" y="450" fill="#4B5563">barely glowing,</text>
    <text x="1326" y="468" fill="#4B5563">no ticking</text>
  </g>

  <!-- arrows -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a9)">
    <path d="M292 161 H326"/>
    <path d="M292 363 H326"/>
    <path d="M292 565 H326"/>
    <path d="M612 161 H646"/>
    <path d="M612 363 H646"/>
    <path d="M612 565 H646"/>
    <path d="M962 161 H996"/>
    <path d="M962 363 H996"/>
    <path d="M962 565 H996"/>
    <path d="M1272 161 C 1292 161, 1290 280, 1306 280"/>
    <path d="M1272 363 H1306"/>
    <path d="M1272 565 C 1292 565, 1290 450, 1306 450"/>
    <path d="M805 684 V660"/>
  </g>
</svg>
