<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 470" width="1340" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v7: lifecycle management (all items in a room) is a separate module before the representation module.
       Representation module = 1 Decide (blue) + 2 Update (green), per item; green coordinates one object's modalities. -->
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1340" height="470" fill="#FFFFFF"/>

  <!-- information items (stack) -->
  <rect x="32" y="148" width="170" height="140" rx="10" fill="#F7F8F9" stroke="#D5D9DE"/>
  <rect x="26" y="154" width="170" height="140" rx="10" fill="#F5F6F7" stroke="#D0D4D9"/>
  <rect x="20" y="160" width="170" height="140" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="36" y="190" font-size="15" font-weight="700" fill="#1F2328">Information items</text>
  <text x="36" y="214" font-size="12.5" fill="#4B5563">many per room, from</text>
  <text x="36" y="232" font-size="12.5" fill="#4B5563">upstream components,</text>
  <text x="36" y="250" font-size="12.5" fill="#4B5563">with their updates</text>

  <!-- lifecycle management module -->
  <rect x="236" y="130" width="210" height="200" rx="12" fill="#F5F2FE" stroke="#7C5CD6"/>
  <text x="254" y="158" font-size="15" font-weight="700" fill="#1F2328">Lifecycle management</text>
  <text x="254" y="178" font-size="12" fill="#7C5CD6">all items in a room</text>
  <text x="254" y="210" font-size="12.5" fill="#4B5563">which items are active</text>
  <text x="254" y="232" font-size="12.5" fill="#4B5563">relative prominence:</text>
  <text x="254" y="250" font-size="12.5" fill="#4B5563">some strong, some weak,</text>
  <text x="254" y="268" font-size="12.5" fill="#4B5563">weak but never gone</text>
  <text x="254" y="296" font-size="12" fill="#7C5CD6">out: items + prominence</text>
  <text x="254" y="316" font-size="12" fill="#9CA3AF">details TBD</text>

  <!-- representation module frame -->
  <rect x="490" y="16" width="670" height="430" rx="16" fill="none" stroke="#9CA3AF" stroke-dasharray="6 5"/>
  <text x="510" y="42" font-size="12" font-weight="700" fill="#4B5563" letter-spacing="1">REPRESENTATION MODULE · PER ITEM</text>

  <!-- inputs to step 1 -->
  <rect x="510" y="58" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="580" y="81" font-size="12.5" fill="#1F2328" text-anchor="middle">Objects in the room</text>
  <rect x="660" y="58" width="140" height="36" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="730" y="81" font-size="12.5" fill="#1F2328" text-anchor="middle">Library of signs</text>

  <!-- step 1 -->
  <rect x="510" y="110" width="300" height="262" rx="12" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="528" y="138" font-size="15" font-weight="700" fill="#1F2328">1  Decide</text>
  <text x="528" y="156" font-size="12" fill="#2F6FEB">once per item · LLM</text>
  <rect x="528" y="168" width="264" height="48" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="542" y="187" font-size="13" font-weight="700" fill="#1F2328">Where</text>
  <text x="542" y="205" font-size="12.5" fill="#4B5563">the object, or part of it, that shows it</text>
  <rect x="528" y="224" width="264" height="48" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="542" y="243" font-size="13" font-weight="700" fill="#1F2328">What</text>
  <text x="542" y="261" font-size="12.5" fill="#4B5563">the natural sign it gives off</text>
  <rect x="528" y="280" width="264" height="48" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="542" y="299" font-size="13" font-weight="700" fill="#1F2328">Digital layer</text>
  <text x="542" y="317" font-size="12.5" fill="#4B5563">whether to add text anchored there</text>
  <text x="528" y="354" font-size="12.5" fill="#2F6FEB">e.g. meeting soon → the wall clock ticks</text>

  <!-- step 2 -->
  <rect x="840" y="110" width="300" height="262" rx="12" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="858" y="138" font-size="15" font-weight="700" fill="#1F2328">2  Update</text>
  <text x="858" y="156" font-size="12" fill="#0F8A78">one object, across its modalities · rules</text>
  <rect x="858" y="168" width="264" height="48" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="872" y="187" font-size="13" font-weight="700" fill="#1F2328">When shown</text>
  <text x="872" y="205" font-size="12.5" fill="#4B5563">for each modality: visual, sound, text</text>
  <rect x="858" y="224" width="264" height="64" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="872" y="243" font-size="13" font-weight="700" fill="#1F2328">How strong</text>
  <text x="872" y="261" font-size="12.5" fill="#4B5563">further from normal → stronger,</text>
  <text x="872" y="278" font-size="12.5" fill="#4B5563">scaled by the item's prominence</text>
  <text x="858" y="354" font-size="12.5" fill="#0F8A78">e.g. the ticking quickens as it nears</text>

  <!-- human context, feeds both steps -->
  <rect x="720" y="396" width="210" height="36" rx="8" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="825" y="419" font-size="12.5" fill="#1F2328" text-anchor="middle">Human context: position, view</text>

  <!-- output (stack) -->
  <rect x="1192" y="168" width="136" height="130" rx="10" fill="#FFF9F1" stroke="#F0C48A"/>
  <rect x="1186" y="174" width="136" height="130" rx="10" fill="#FFF7EB" stroke="#E9B272"/>
  <rect x="1180" y="180" width="136" height="130" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="1196" y="210" font-size="15" font-weight="700" fill="#1F2328">All cues</text>
  <text x="1196" y="230" font-size="15" font-weight="700" fill="#1F2328">in AR</text>

  <!-- flow -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a7)">
    <path d="M192 230 H232"/>
    <path d="M448 230 H506"/>
    <path d="M812 240 H836"/>
    <path d="M1142 240 H1176"/>
    <path d="M580 96 V106"/>
    <path d="M730 96 V106"/>
    <path d="M780 394 V376"/>
    <path d="M880 394 V376"/>
  </g>
</svg>
