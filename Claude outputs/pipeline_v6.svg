<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v6: items flow through step 1 (decide, once per item) then step 2 (update). Human context feeds both steps. Output is the whole set of cues. Example: a meeting. -->
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1160" height="470" fill="#FFFFFF"/>

  <!-- inputs to step 1 -->
  <rect x="262" y="14" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="332" y="39" font-size="12.5" fill="#1F2328" text-anchor="middle">Objects in the room</text>
  <rect x="412" y="14" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="482" y="39" font-size="12.5" fill="#1F2328" text-anchor="middle">Library of signs</text>

  <!-- information items (stack) -->
  <rect x="32" y="98" width="190" height="150" rx="10" fill="#F7F8F9" stroke="#D5D9DE"/>
  <rect x="26" y="104" width="190" height="150" rx="10" fill="#F5F6F7" stroke="#D0D4D9"/>
  <rect x="20" y="110" width="190" height="150" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="38" y="140" font-size="15" font-weight="700" fill="#1F2328">Information items</text>
  <text x="38" y="166" font-size="12.5" fill="#4B5563">what each is about,</text>
  <text x="38" y="184" font-size="12.5" fill="#4B5563">its value, its normal,</text>
  <text x="38" y="202" font-size="12.5" fill="#4B5563">how urgent</text>
  <text x="38" y="238" font-size="12" fill="#6B7280">from upstream components</text>

  <!-- step 1 -->
  <rect x="250" y="70" width="310" height="272" rx="12" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="268" y="98" font-size="15" font-weight="700" fill="#1F2328">1  Decide</text>
  <text x="268" y="118" font-size="12" fill="#2F6FEB">once per item · LLM</text>
  <rect x="268" y="130" width="274" height="50" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="150" font-size="13" font-weight="700" fill="#1F2328">Where</text>
  <text x="282" y="169" font-size="12.5" fill="#4B5563">the object, or part of it, that shows it</text>
  <rect x="268" y="188" width="274" height="50" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="208" font-size="13" font-weight="700" fill="#1F2328">What</text>
  <text x="282" y="227" font-size="12.5" fill="#4B5563">the natural sign it gives off</text>
  <rect x="268" y="246" width="274" height="50" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="266" font-size="13" font-weight="700" fill="#1F2328">Digital layer</text>
  <text x="282" y="285" font-size="12.5" fill="#4B5563">whether to add text anchored there</text>
  <text x="268" y="322" font-size="12.5" fill="#2F6FEB">e.g. meeting soon → the wall clock ticks</text>

  <!-- step 2 -->
  <rect x="600" y="70" width="300" height="272" rx="12" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="618" y="98" font-size="15" font-weight="700" fill="#1F2328">2  Update</text>
  <text x="618" y="118" font-size="12" fill="#0F8A78">when the value or the context changes · rules</text>
  <rect x="618" y="130" width="264" height="50" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="632" y="150" font-size="13" font-weight="700" fill="#1F2328">How strong</text>
  <text x="632" y="169" font-size="12.5" fill="#4B5563">the further from normal, the stronger</text>
  <rect x="618" y="188" width="264" height="50" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="632" y="208" font-size="13" font-weight="700" fill="#1F2328">When shown</text>
  <text x="632" y="227" font-size="12.5" fill="#4B5563">always, or only when the person is near</text>
  <text x="618" y="322" font-size="12.5" fill="#0F8A78">e.g. the ticking quickens as it nears</text>

  <!-- output (stack) -->
  <rect x="952" y="98" width="190" height="170" rx="10" fill="#FFF9F1" stroke="#F0C48A"/>
  <rect x="946" y="104" width="190" height="170" rx="10" fill="#FFF7EB" stroke="#E9B272"/>
  <rect x="940" y="110" width="190" height="170" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="958" y="140" font-size="15" font-weight="700" fill="#1F2328">All cues in AR</text>
  <text x="958" y="166" font-size="12.5" fill="#4B5563">orchestrated and</text>
  <text x="958" y="184" font-size="12.5" fill="#4B5563">updated as a whole</text>

  <!-- human context -->
  <rect x="470" y="358" width="220" height="44" rx="8" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="580" y="385" font-size="12.5" fill="#1F2328" text-anchor="middle">Human context: position, view</text>

  <!-- flow -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a6)">
    <path d="M212 195 H246"/>
    <path d="M562 195 H596"/>
    <path d="M902 195 H936"/>
    <path d="M332 56 V66"/>
    <path d="M482 56 V66"/>
    <path d="M520 356 V346"/>
    <path d="M640 356 V346"/>
    <path d="M115 262 C 115 470, 820 470, 820 346"/>
  </g>
  <text x="300" y="452" font-size="12" fill="#6B7280" text-anchor="middle">new values from upstream</text>
</svg>
