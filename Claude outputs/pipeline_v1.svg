<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" width="1240" height="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v1: one horizontal flow. Grey = input, blue = semantic step (LLM), teal = rule step, amber = output. -->
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1240" height="360" fill="#FFFFFF"/>

  <!-- main row -->
  <g font-size="14" fill="#1F2328" text-anchor="middle">
    <!-- upstream -->
    <rect x="20" y="80" width="150" height="110" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
    <text x="95" y="110" font-weight="700">Upstream</text>
    <text x="95" y="134" font-size="12.5" fill="#4B5563">sensors</text>
    <text x="95" y="152" font-size="12.5" fill="#4B5563">device APIs</text>
    <text x="95" y="170" font-size="12.5" fill="#4B5563">AI models</text>

    <!-- info item -->
    <rect x="194" y="80" width="150" height="110" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
    <text x="269" y="110" font-weight="700">Information item</text>
    <text x="269" y="134" font-size="12.5" fill="#4B5563">referent · quality</text>
    <text x="269" y="152" font-size="12.5" fill="#4B5563">value · urgency</text>
    <text x="269" y="172" font-size="12" fill="#6B7280" font-family="Menlo, monospace">{ JSON }</text>

    <!-- step 1 -->
    <rect x="368" y="80" width="150" height="110" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
    <text x="443" y="110" font-weight="700">1  Carrier</text>
    <text x="443" y="128" font-weight="700">resolution</text>
    <text x="443" y="156" font-size="12" fill="#2F6FEB">referent part</text>
    <text x="443" y="172" font-size="12" fill="#2F6FEB">/ proxy / direction</text>

    <!-- step 2 -->
    <rect x="542" y="80" width="150" height="110" rx="10" fill="#EAF1FF" stroke="#2F6FEB"/>
    <text x="617" y="110" font-weight="700">2  Phenomenon</text>
    <text x="617" y="128" font-weight="700">selection</text>
    <text x="617" y="156" font-size="12" fill="#2F6FEB">phenomenon</text>
    <text x="617" y="172" font-size="12" fill="#2F6FEB">→ cue type</text>

    <!-- step 3 -->
    <rect x="716" y="80" width="150" height="110" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
    <text x="791" y="110" font-weight="700">3  Dynamics</text>
    <text x="791" y="156" font-size="12" fill="#0F8A78">intensity, rate</text>
    <text x="791" y="172" font-size="12" fill="#0F8A78">from value type</text>

    <!-- step 4 -->
    <rect x="890" y="80" width="150" height="110" rx="10" fill="#E7F6F3" stroke="#0F8A78"/>
    <text x="965" y="110" font-weight="700">4  Trigger</text>
    <text x="965" y="156" font-size="12" fill="#0F8A78">always /</text>
    <text x="965" y="172" font-size="12" fill="#0F8A78">on approach</text>

    <!-- output -->
    <rect x="1064" y="80" width="156" height="110" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
    <text x="1142" y="110" font-weight="700">Indexical cue</text>
    <text x="1142" y="134" font-size="12.5" fill="#4B5563">rendered on the</text>
    <text x="1142" y="152" font-size="12.5" fill="#4B5563">carrier in AR</text>
    <text x="1142" y="172" font-size="12" fill="#C26A00">Vision Pro</text>
  </g>

  <!-- arrows along the row -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a1)">
    <path d="M172 135 H190"/>
    <path d="M346 135 H364"/>
    <path d="M520 135 H538"/>
    <path d="M694 135 H712"/>
    <path d="M868 135 H886"/>
    <path d="M1042 135 H1060"/>
  </g>

  <!-- side resources -->
  <g font-size="12.5" text-anchor="middle" fill="#1F2328">
    <rect x="368" y="232" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
    <text x="443" y="254" font-weight="700">Scene description</text>
    <text x="443" y="272" font-size="11.5" fill="#4B5563">objects, parts, directions</text>
    <rect x="542" y="232" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
    <text x="617" y="254" font-weight="700">Phenomenon library</text>
    <text x="617" y="272" font-size="11.5" fill="#4B5563">natural signs + cue types</text>
    <text x="791" y="214" font-size="11.5" fill="#6B7280">uses value, normal state</text>
    <text x="965" y="214" font-size="11.5" fill="#6B7280">uses urgency</text>
  </g>
  <g stroke="#9DB8F2" stroke-width="1.6" fill="none" marker-end="url(#a1)">
    <path d="M443 230 V194"/>
    <path d="M617 230 V194"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#4B5563">
    <rect x="368" y="318" width="14" height="14" rx="3" fill="#EAF1FF" stroke="#2F6FEB"/>
    <text x="390" y="330">semantic choice from a finite set (LLM)</text>
    <rect x="660" y="318" width="14" height="14" rx="3" fill="#E7F6F3" stroke="#0F8A78"/>
    <text x="682" y="330">rule</text>
  </g>
</svg>
