<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 430" width="1140" height="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v5: sequential. Step 1 decides where and what, once per item. Step 2 keeps updating that cue while the state lasts. Example: tea. -->
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1140" height="430" fill="#FFFFFF"/>

  <!-- inputs to step 1 -->
  <rect x="268" y="16" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="332" y="41" font-size="12.5" fill="#1F2328" text-anchor="middle">Objects in the room</text>
  <rect x="404" y="16" width="128" height="40" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="468" y="41" font-size="12.5" fill="#1F2328" text-anchor="middle">Library of signs</text>

  <!-- information item -->
  <rect x="20" y="120" width="190" height="150" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="38" y="150" font-size="15" font-weight="700" fill="#1F2328">Information item</text>
  <text x="38" y="174" font-size="12.5" fill="#4B5563">what it is about,</text>
  <text x="38" y="192" font-size="12.5" fill="#4B5563">its value, its normal,</text>
  <text x="38" y="210" font-size="12.5" fill="#4B5563">how urgent</text>
  <text x="38" y="246" font-size="12" fill="#6B7280" font-family="Menlo, monospace">tea · 72 °C · &lt;60</text>

  <!-- step 1 -->
  <rect x="250" y="80" width="300" height="230" rx="12" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="268" y="108" font-size="15" font-weight="700" fill="#1F2328">1  Decide where and what</text>
  <text x="268" y="128" font-size="12" fill="#2F6FEB">once, when the item arrives · LLM</text>
  <rect x="268" y="142" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="164" font-size="13" font-weight="700" fill="#1F2328">Where</text>
  <text x="282" y="184" font-size="12.5" fill="#4B5563">the object, or part of it, that shows it</text>
  <rect x="268" y="206" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="228" font-size="13" font-weight="700" fill="#1F2328">What</text>
  <text x="282" y="248" font-size="12.5" fill="#4B5563">the natural sign it gives off</text>
  <text x="268" y="290" font-size="12.5" fill="#2F6FEB">chosen together → steam at the rim of the cup</text>

  <!-- step 2 -->
  <rect x="590" y="80" width="300" height="230" rx="12" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="608" y="108" font-size="15" font-weight="700" fill="#1F2328">2  Update while it lasts</text>
  <text x="608" y="128" font-size="12" fill="#0F8A78">each time the value changes · rules</text>
  <rect x="608" y="142" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="622" y="164" font-size="13" font-weight="700" fill="#1F2328">How strong</text>
  <text x="622" y="184" font-size="12.5" fill="#4B5563">the further from normal, the stronger</text>
  <rect x="608" y="206" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="622" y="228" font-size="13" font-weight="700" fill="#1F2328">When visible</text>
  <text x="622" y="248" font-size="12.5" fill="#4B5563">always, or only when the person is near</text>
  <text x="608" y="290" font-size="12.5" fill="#0F8A78">light steam at 72 °C, none at 60 °C</text>

  <!-- output -->
  <rect x="930" y="120" width="190" height="150" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="948" y="150" font-size="15" font-weight="700" fill="#1F2328">Shown in AR</text>
  <text x="948" y="174" font-size="12.5" fill="#C26A00">Vision Pro</text>
  <text x="948" y="210" font-size="12.5" fill="#4B5563">removed when the</text>
  <text x="948" y="228" font-size="12.5" fill="#4B5563">value is back to normal</text>

  <!-- digital layer (future) -->
  <rect x="20" y="330" width="190" height="44" rx="10" fill="#FFFFFF" stroke="#C9CDD3" stroke-dasharray="5 4"/>
  <text x="115" y="357" font-size="12.5" fill="#9CA3AF" text-anchor="middle">Digital layer (future work)</text>

  <!-- person's position -->
  <rect x="740" y="352" width="150" height="44" rx="8" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="815" y="379" font-size="12.5" fill="#1F2328" text-anchor="middle">Person's position</text>

  <!-- main flow -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a5)">
    <path d="M212 195 H246"/>
    <path d="M552 195 H586"/>
    <path d="M892 195 H926"/>
    <path d="M332 58 V76"/>
    <path d="M468 58 V76"/>
    <path d="M815 350 V314"/>
    <path d="M160 272 C 160 412, 600 412, 668 314"/>
  </g>
  <path d="M115 272 V326" stroke="#C9CDD3" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#a5)"/>
  <text x="430" y="388" font-size="12" fill="#6B7280" text-anchor="middle">new values from upstream</text>
</svg>
