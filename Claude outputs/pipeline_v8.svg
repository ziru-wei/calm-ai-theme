<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- v8: order is 1 (representation) → lifecycle → 2 (representation).
       Representation (per item): 1 chooses where and the ways the cue can show (fixed); 2 shows it within what lifecycle allows (changes).
       Lifecycle (all cues in a room): allocates modalities across items; the only module that sees human context. Example: the bus. -->
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/>
    </marker>
  </defs>
  <rect width="1300" height="560" fill="#FFFFFF"/>

  <!-- information items -->
  <rect x="32" y="108" width="170" height="140" rx="10" fill="#F7F8F9" stroke="#D5D9DE"/>
  <rect x="26" y="114" width="170" height="140" rx="10" fill="#F5F6F7" stroke="#D0D4D9"/>
  <rect x="20" y="120" width="170" height="140" rx="10" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="36" y="150" font-size="15" font-weight="700" fill="#1F2328">Information items</text>
  <text x="36" y="174" font-size="12.5" fill="#4B5563">from upstream,</text>
  <text x="36" y="192" font-size="12.5" fill="#4B5563">many per room,</text>
  <text x="36" y="210" font-size="12.5" fill="#4B5563">with their updates</text>

  <!-- representation module -->
  <rect x="230" y="16" width="820" height="296" rx="16" fill="none" stroke="#9CA3AF" stroke-dasharray="6 5"/>
  <text x="250" y="40" font-size="12" font-weight="700" fill="#4B5563" letter-spacing="1">REPRESENTATION MODULE · PER ITEM</text>

  <rect x="250" y="54" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="320" y="76" font-size="12.5" fill="#1F2328" text-anchor="middle">Objects in the room</text>
  <rect x="400" y="54" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#9DB8F2" stroke-dasharray="4 3"/>
  <text x="470" y="76" font-size="12.5" fill="#1F2328" text-anchor="middle">Library of signs</text>

  <!-- step 1 -->
  <rect x="250" y="100" width="350" height="196" rx="12" fill="#EAF1FF" stroke="#2F6FEB"/>
  <text x="268" y="126" font-size="15" font-weight="700" fill="#1F2328">1  Choose where, and how it can show</text>
  <text x="268" y="144" font-size="12" fill="#2F6FEB">once per item · fixed · LLM</text>
  <rect x="268" y="154" width="314" height="44" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="172" font-size="13" font-weight="700" fill="#1F2328">Where</text>
  <text x="282" y="189" font-size="12" fill="#4B5563">the window facing the street</text>
  <rect x="268" y="206" width="314" height="78" rx="8" fill="#FFFFFF" stroke="#C7D7F8"/>
  <text x="282" y="224" font-size="13" font-weight="700" fill="#1F2328">Ways to show it</text>
  <text x="282" y="242" font-size="12" fill="#4B5563">visual: headlights sweep across the glass</text>
  <text x="282" y="258" font-size="12" fill="#4B5563">sound: an engine from the street</text>
  <text x="282" y="274" font-size="12" fill="#4B5563">text: Bus 204 · 4 min</text>

  <!-- step 2 -->
  <rect x="690" y="100" width="340" height="196" rx="12" fill="#E7F6F3" stroke="#0F8A78"/>
  <text x="708" y="126" font-size="15" font-weight="700" fill="#1F2328">2  Show within what is allowed</text>
  <text x="708" y="144" font-size="12" fill="#0F8A78">when the value or the allowance changes · rules</text>
  <rect x="708" y="154" width="304" height="44" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="722" y="172" font-size="13" font-weight="700" fill="#1F2328">Strength from the value</text>
  <text x="722" y="189" font-size="12" fill="#4B5563">4 min to arrival → 0.6</text>
  <rect x="708" y="206" width="304" height="78" rx="8" fill="#FFFFFF" stroke="#BFE3DB"/>
  <text x="722" y="224" font-size="13" font-weight="700" fill="#1F2328">Each modality: strength × allowed</text>
  <text x="722" y="242" font-size="12" fill="#4B5563">sound: engine at 0.6 × 1.0</text>
  <text x="722" y="258" font-size="12" fill="#4B5563">visual: headlights at 0.6 × 0.8</text>
  <text x="722" y="274" font-size="12" fill="#4B5563">text: shown</text>

  <!-- lifecycle module -->
  <rect x="420" y="360" width="440" height="176" rx="12" fill="#F5F2FE" stroke="#7C5CD6"/>
  <text x="440" y="388" font-size="15" font-weight="700" fill="#1F2328">Lifecycle management</text>
  <text x="440" y="406" font-size="12" fill="#7C5CD6">all cues in a room · changes over time · rules</text>
  <text x="440" y="434" font-size="12.5" fill="#4B5563">one sound at a time, to the most urgent</text>
  <text x="440" y="454" font-size="12.5" fill="#4B5563">visuals that fit together can share an object</text>
  <text x="440" y="474" font-size="12.5" fill="#4B5563">text only where the person is looking</text>
  <text x="440" y="494" font-size="12.5" fill="#4B5563">low urgency and far away → gone for now</text>
  <text x="440" y="522" font-size="12" fill="#7C5CD6">bus: visual 0.8 · sound 1.0 · text on</text>

  <!-- human context -->
  <rect x="900" y="426" width="200" height="44" rx="8" fill="#F3F4F6" stroke="#C9CDD3"/>
  <text x="1000" y="453" font-size="12.5" fill="#1F2328" text-anchor="middle">Human context: position, view</text>

  <!-- output -->
  <rect x="1102" y="118" width="180" height="150" rx="10" fill="#FFF9F1" stroke="#F0C48A"/>
  <rect x="1096" y="124" width="180" height="150" rx="10" fill="#FFF7EB" stroke="#E9B272"/>
  <rect x="1090" y="130" width="180" height="150" rx="10" fill="#FFF4E5" stroke="#C26A00"/>
  <text x="1106" y="160" font-size="15" font-weight="700" fill="#1F2328">All cues in AR</text>
  <text x="1106" y="184" font-size="12.5" fill="#4B5563">some strong, some weak,</text>
  <text x="1106" y="202" font-size="12.5" fill="#4B5563">some gone for now</text>

  <!-- flow -->
  <g stroke="#8A9099" stroke-width="1.8" fill="none" marker-end="url(#a8)">
    <path d="M192 190 H246"/>
    <path d="M320 90 V96"/>
    <path d="M470 90 V96"/>
    <path d="M520 298 C 520 330, 560 330, 560 356"/>
    <path d="M740 358 C 740 330, 780 330, 780 300"/>
    <path d="M1032 200 H1086"/>
    <path d="M898 448 H864"/>
    <path d="M105 262 C 105 450, 300 450, 416 450"/>
  </g>
  <g font-size="11.5" fill="#6B7280">
    <text x="570" y="340">where + ways to show</text>
    <text x="790" y="340">allowed, per modality</text>
    <text x="180" y="472">all items, with urgency</text>
  </g>
</svg>
